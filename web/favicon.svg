<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="gc" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gp" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Clipped-corner background matching site's polygon aesthetic -->
  <polygon points="5,0 27,0 32,5 32,27 27,32 5,32 0,27 0,5" fill="#050510"/>
  <!-- Subtle cyan border -->
  <polygon points="5,0 27,0 32,5 32,27 27,32 5,32 0,27 0,5" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  <!-- G in neon cyan -->
  <text x="3" y="23" font-family="Arial Black,Impact,sans-serif" font-size="17" font-weight="900" fill="#00f5ff" filter="url(#gc)">G</text>
  <!-- X in neon pink -->
  <text x="17" y="23" font-family="Arial Black,Impact,sans-serif" font-size="17" font-weight="900" fill="#ff006e" filter="url(#gp)">X</text>
</svg>
