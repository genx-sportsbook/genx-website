name: Refresh Homepage Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh homepage via Gemini
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/refresh_homepage.py

      - name: Commit and push
        run: |
          git config user.name  "Genx Content Bot"
          git config user.email "bot@genx-sportsbook.io"
          git add web/index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh homepage content"
          git push
