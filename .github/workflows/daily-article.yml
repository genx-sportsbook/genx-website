name: Daily Article Generator

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate article but do not commit (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate article via Gemini
        id: article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py

      - name: Rebuild news index and homepage cards
        run: python scripts/generate_news_index.py

      - name: Commit and push
        if: ${{ github.event.inputs.dry_run != 'true' && steps.article.outputs.filename != '' }}
        run: |
          git config user.name  "Genx Article Bot"
          git config user.email "bot@genx-sportsbook.io"
          git add web/articles/${{ steps.article.outputs.filename }} web/index.html web/news.html
          git commit -m "chore: daily article — ${{ steps.article.outputs.title }}"
          git push
