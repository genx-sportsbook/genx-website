name: Daily Content Refresh

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate content but do not commit (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. Generate today's article
      - name: Generate daily article
        id: article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py

      # 2. Prepend article card to the homepage news grid
      - name: Add article card to homepage
        if: steps.article.outputs.filename != ''
        env:
          FILENAME: ${{ steps.article.outputs.filename }}
          TITLE:    ${{ steps.article.outputs.title }}
          EXCERPT:  ${{ steps.article.outputs.excerpt }}
          CATEGORY: ${{ steps.article.outputs.category }}
        run: |
          python - <<'PYEOF'
          import os, re
          from datetime import date

          filename = os.environ["FILENAME"]
          title    = os.environ["TITLE"]
          excerpt  = os.environ["EXCERPT"]
          category = os.environ["CATEGORY"]
          today    = date.today().strftime("%-d %B %Y")

          colour_map = {
              "Market Analysis":    "var(--neon-purple)",
              "Sports Intelligence":"var(--neon-pink)",
              "Platform Update":    "var(--neon-green)",
              "Market Intelligence":"var(--neon-cyan)",
              "Industry Insight":   "var(--neon-yellow)",
          }
          colour = colour_map.get(category, "var(--neon-cyan)")

          new_card = f"""
            <article class="blog-card" style="--card-color: {colour}">
              <div class="blog-category">{category}</div>
              <div class="blog-date">{today}</div>
              <h3 class="blog-title">{title}</h3>
              <p class="blog-excerpt">{excerpt}</p>
              <a href="articles/{filename}" class="blog-read-more">Read more</a>
            </article>
          """

          with open("web/index.html", "r") as f:
              content = f.read()

          content = content.replace(
              '\n    <article class="blog-card"',
              new_card + '\n    <article class="blog-card"',
              1,
          )

          with open("web/index.html", "w") as f:
              f.write(content)

          print(f"Prepended card for: {title}")
          PYEOF

      # 3. Refresh homepage dynamic sections (ticker, stats, markets)
      - name: Refresh homepage content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/refresh_homepage.py

      # 4. Refresh markets page
      - name: Refresh markets page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_markets.py

      # 5. Refresh live feed page
      - name: Refresh live feed page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_live.py

      # 6. Rebuild news index (now includes today's new article)
      - name: Rebuild news index
        run: python scripts/generate_news_index.py

      # 7. Commit everything in one go
      - name: Commit and push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Genx Content Bot"
          git config user.email "bot@genx-sportsbook.io"
          git add web/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily content refresh — ${{ steps.article.outputs.title || 'homepage + pages' }}"
          git push
